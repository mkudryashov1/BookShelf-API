services:
  db:
    image: postgres:16
    container_name: bookshelf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookshelf
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookshelf"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: bookshelf-migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@db:5432/bookshelf?sslmode=disable",
        "up"
      ]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    container_name: bookshelf-app
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DB_DSN: postgres://postgres:postgres@db:5432/bookshelf?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: